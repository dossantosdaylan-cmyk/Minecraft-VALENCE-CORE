	body {
		overflow: hidden;
		margin: 0;
		padding: 0;
		background-color: #000;
	}
	.world-select {
		width: 99vw;
		min-width: 300px;
		height: calc(100vh - 220px);
		position: absolute;
		bottom: 120px;
		overflow-y: auto;
		background-color: RGBA(0, 0, 0, 0.6);
		justify-content: center;
		margin: 0 auto;
	}
	.world {
		width: 250px;
		height: auto;
		border: 2px solid #333;
		background: rgba(0,0,0,0.5);
		font-size: 14px;
		font-family: "Press Start 2P", "VT323", monospace;
		color: rgb(180, 180, 180);
		margin: 0 auto;
		margin-top: 15px;
		padding: 10px;
		cursor: pointer;
		line-height: 1.6;
		transition: 0.2s;
	}
	.world:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
	strong { color: white; }
	.selected { border: 3px solid #55ff55; background: rgba(85,255,85,0.2); }
	input[type=text] {
		background-color: black;
		caret-color: white;
		border: 2px solid gray;
		color: white;
		font-size: 14px;
		padding: 10px 12px;
		font-family: "Press Start 2P", "VT323", monospace;
	}
	input[type=text]:focus { border: 2px solid lightgray; }
	#boxcentertop {
		z-index: 1;
		width: 80vw;
		max-width: 400px;
		height: 50px;
		position: relative;
		top: 30px;
		display: block;
		margin: 0 auto;
	}
	.hidden { display: none !important; }
	#onhover {
		background-color: rgba(0, 0, 0, 0.9);
		color: rgb(200, 200, 200);
		font-family: "Press Start 2P", "VT323", monospace;
		word-wrap: normal;
		width: auto;
		max-width: 400px;
		position: absolute;
		z-index: 1;
		padding: 10px;
		cursor: default;
		font-size: 10px;
		line-height: 1.7;
		border: 2px solid #fff;
	}
	#quota {
		display: block;
		position: absolute;
		width: 99vw;
		margin: 0 auto;
		bottom: 110px;
		z-index: 1;
		background-color: RGBA(0, 0, 0, 0.6);
		justify-content: center;
		text-align: center;
		color: white;
		font-size: 10px;
	}
	* { font-family: 'Press Start 2P', 'VT323', monospace !important; }

	/* Nicks Flotantes */
	.nick-tag {
		position: absolute;
		color: white;
		font-size: 12px;
		font-family: 'Press Start 2P', monospace;
		text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
		pointer-events: none;
		z-index: 100;
		transform: translate(-50%, -50%);
	}
	/* Reloj en pantalla (Fase 1) */
	#clock {
		position: fixed;
		top: 10px;
		left: 50%;
		transform: translateX(-50%);
		color: #ffe9a8;
		background: rgba(0,0,0,0.55);
		padding: 6px 12px;
		font-family: 'Press Start 2P', monospace;
		font-size: 11px;
		border-radius: 6px;
		z-index: 10;
		display: none;
		text-shadow: 1px 1px 2px #000;
		pointer-events: none;
		border: 1px solid rgba(255,255,255,0.15);
	}

	<script type="x-shader/vertex" id="blockVertexShader">
		attribute vec3  aVertex;
		attribute vec2  aTexture;
		attribute float aShadow;
		varying vec2  vTexture;
		varying float vShadow;
		varying float vFog;
		uniform mat4 uView;
		uniform float uDist;
		uniform vec3 uPos;

		void main(void) {
			vTexture = aTexture;
			vShadow = aShadow > 0.0 ? aShadow : 1.0;
			gl_Position = uView * vec4( aVertex, 1.0);

			float range = max(uDist / 2.5, 8.0);
			vFog = clamp((length(uPos.xz - aVertex.xz) - uDist + range) / range, 0.0, 1.0);
		}
	</script>
	<script type="x-shader/fragment" id="blockFragmentShader">
		#ifdef GL_FRAGMENT_PRECISION_HIGH
			precision highp float;
		#else
			precision mediump float;
		#endif

		uniform sampler2D uSampler;
		uniform vec3 uSky;
		uniform float uLight;
		uniform vec3 uTint;
		uniform float uFloor;
		uniform float uQ;
		uniform float uDith;
		uniform float uHD;
		varying float vShadow;
		varying vec2 vTexture;
		varying float vFog;

		vec4 fog(vec4 color) {
			color.r += (uSky.r - color.r) * vFog;
			color.g += (uSky.g - color.g) * vFog;
			color.b += (uSky.b - color.b) * vFog;
			return color;
		}

		void main(void){
			vec4 color = texture2D(uSampler, vTexture);
			vec3 c = color.rgb * vShadow * uLight * uTint; c = max(c, color.rgb * uFloor * uTint);
			if (uHD > 0.5) {
				vec2 tp = floor(vTexture * 1024.0);
				float n = fract(sin(dot(tp, vec2(12.9898, 78.233))) * 43758.5453);
				c *= 0.9 + 0.2 * n;
				float sun = smoothstep(0.6, 1.0, vShadow);
				c *= mix(vec3(0.80, 0.90, 1.10), vec3(1.14, 1.06, 0.90), sun);
				c *= 1.15;
			}
			gl_FragColor = fog(vec4(c, color.a));
			if (gl_FragColor.a == 0.0) discard;
			if (uHD > 0.5) {
				vec3 x = gl_FragColor.rgb;
				x = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
				float l = dot(x, vec3(0.299, 0.587, 0.114));
				gl_FragColor.rgb = mix(vec3(l), x, 1.2);
			}
			if (uQ > 0.0) {
				float d = fract(52.9829189 * fract(dot(floor(gl_FragCoord.xy), vec2(0.06711056, 0.00583715))));
				vec3 x = gl_FragColor.rgb + (d - 0.5) / uQ * uDith;
				gl_FragColor.rgb = clamp(floor(x * uQ + 0.5) / uQ, 0.0, 1.0);
			}
		}
	</script>
	<script type="x-shader/vertex" id="2dVertexShader">
		attribute vec2 aVertex;
		attribute vec2 aTexture;
		attribute float aShadow;
		varying vec2 vTexture;
		varying float vShadow;

		void main(void) {
			vTexture = aTexture;
			vShadow = aShadow;
			gl_Position = vec4(aVertex, 0.5, 1.0);
		}
	</script>
	<script type="x-shader/fragment" id="2dFragmentShader">
		#ifdef GL_FRAGMENT_PRECISION_HIGH
			precision highp float;
		#else
			precision mediump float;
		#endif

		uniform sampler2D uSampler;
		varying vec2 vTexture;
		varying float vShadow;

		void main(void) {
			vec4 color = texture2D(uSampler, vTexture);
			gl_FragColor = vec4(color.rgb * vShadow, color.a);
			if (gl_FragColor.a == 0.0) discard;
		}
	</script>

	let texAtlas = null

	const sst = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
	function biomeCol(wx, wz) { // [altura, bioma, 2do bioma, mezcla 0-0.5]
		const n = noise(wx * 0.012, wz * 0.012)
		const t = Math.max(0, Math.min(1, (noise(wx * 0.0035 + 111.1, wz * 0.0035 + 111.1) - 0.469) / 0.2 + 0.5))
		const hu = Math.max(0, Math.min(1, (noise(wx * 0.0035 + 777.7, wz * 0.0035 + 777.7) - 0.469) / 0.2 + 0.5))

		const wP = Math.max(0.05, 1 - wM - wD - wMi - wL), s = wP + wM + wD + wMi + wL
		let h = (wP * (64 + (n - 0.5) * 14) + wMi * (80 + (n - 0.5) * 60) + wL * (62 + (n - 0.45) * 22) + wM * (112 + (n - 0.5) * 110) + wD * (63 + (n - 0.5) * 30)) / s

		_bw[0] = wP; _bw[1] = wMi; _bw[2] = wL; _bw[3] = wM; _bw[4] = wD

		_bc[0] = Math.round(h); _bc[1] = b; _bc[2] = m2 > 0.02 ? b2 : -1; _bc[3] = m2 > 0 ? m2 / (m + m2) : 0; return _bc
